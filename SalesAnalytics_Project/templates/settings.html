{% extends 'base.html' %}{% block title %}Settings{% endblock %}{% block content %}<div class="page-intro"><h2>Settings</h2><p>Manage your profile, notifications and dashboard preferences.</p></div><section class="section-card settings-card"><h2>Profile</h2><div class="profile"><div class="avatar big">{{user.username[0]|upper}}</div><div><b>{{user.username}}</b><p>{{user.email}} · {{user.role}}</p></div></div><form method="post"><h3>Preferences</h3><label class="check"><input type="checkbox" name="notifications" {{'checked' if settings.notifications}}> Enable smart alert notifications</label><label class="check"><input type="checkbox" name="compact_mode" {{'checked' if settings.compact_mode}}> Compact dashboard mode</label><h3>Change Password</h3><input name="new_password" type="password" placeholder="Enter new password"><button class="btn primary">Save Settings</button></form></section>{% endblock %}
